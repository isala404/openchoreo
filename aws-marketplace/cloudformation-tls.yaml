AWSTemplateFormatVersion: '2010-09-09'
Description: OpenChoreo AWS Marketplace - Phase 2 (TLS activation with real certificates)

Parameters:
  Phase1StackName:
    Type: String
    Description: Name of the Phase 1 CloudFormation stack
  TLSMethod:
    Type: String
    Default: self-signed
    AllowedValues: [cloudflare, route53, self-signed]
    Description: TLS certificate method (self-signed keeps Phase 1 certs as-is)
  CloudflareApiToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Cloudflare API token (required if TLSMethod=cloudflare)
  Route53HostedZoneId:
    Type: String
    Default: ''
    Description: Route53 hosted zone ID (required if TLSMethod=route53)
  AdminEmail:
    Type: String
    Description: Email for ACME certificate registration
  OpenChoreoVersion:
    Type: String
    Default: '0.16.0'
    Description: Must match the version used in Phase 1

Conditions:
  IsRoute53: !Equals [!Ref TLSMethod, route53]
  NeedsACME: !Or
    - !Equals [!Ref TLSMethod, cloudflare]
    - !Equals [!Ref TLSMethod, route53]

Resources:
  # ---------------------------------------------------------------------------
  # Route53 IRSA role (only when using Route53 DNS-01)
  # ---------------------------------------------------------------------------
  CertManagerRoute53Policy:
    Type: AWS::IAM::ManagedPolicy
    Condition: IsRoute53
    Properties:
      ManagedPolicyName: !Sub ${Phase1StackName}-cert-manager-route53
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - route53:GetChange
            Resource: arn:aws:route53:::change/*
          - Effect: Allow
            Action:
              - route53:ChangeResourceRecordSets
              - route53:ListResourceRecordSets
            Resource: !Sub arn:aws:route53:::hostedzone/${Route53HostedZoneId}
          - Effect: Allow
            Action:
              - route53:ListHostedZonesByName
            Resource: '*'

  CertManagerRoute53Role:
    Type: AWS::IAM::Role
    Condition: IsRoute53
    Properties:
      RoleName: !Sub ${Phase1StackName}-cert-manager-route53
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {"Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCHost}"},
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "${OIDCHost}:aud": "sts.amazonaws.com",
                  "${OIDCHost}:sub": "system:serviceaccount:cert-manager:cert-manager"
                }
              }
            }]
          }
        - OIDCHost: !ImportValue
            Fn::Sub: ${Phase1StackName}-OIDCIssuerHost
      ManagedPolicyArns: [!Ref CertManagerRoute53Policy]

  # ---------------------------------------------------------------------------
  # CodeBuild for TLS activation
  # ---------------------------------------------------------------------------
  TLSCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Phase1StackName}-tls-codebuild
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: tls-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                Resource: '*'
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:UpdateSecret
                  - secretsmanager:DeleteSecret
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Phase1StackName}/*
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Phase1StackName}/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${Phase1StackName}-*

  TLSAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !ImportValue
        Fn::Sub: ${Phase1StackName}-ClusterName
      PrincipalArn: !GetAtt TLSCodeBuildRole.Arn
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  TLSProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${Phase1StackName}-activate-tls
      ServiceRole: !GetAtt TLSCodeBuildRole.Arn
      TimeoutInMinutes: 30
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: PHASE1_STACK_NAME
            Value: !Ref Phase1StackName
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: TLS_METHOD
            Value: !Ref TLSMethod
          - Name: CLOUDFLARE_API_TOKEN
            Value: !Ref CloudflareApiToken
          - Name: ROUTE53_HOSTED_ZONE_ID
            Value: !Ref Route53HostedZoneId
          - Name: ADMIN_EMAIL
            Value: !Ref AdminEmail
          - Name: CERT_MANAGER_ROUTE53_ROLE_ARN
            Value: !If [IsRoute53, !GetAtt CertManagerRoute53Role.Arn, '']
          - Name: OPENCHOREO_VERSION
            Value: !Ref OpenChoreoVersion
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x kubectl && mv kubectl /usr/local/bin/
            build:
              commands:
                - RELEASE_BRANCH="release-v${OPENCHOREO_VERSION%.*}"
                - git clone --depth 1 --branch "$RELEASE_BRANCH" https://github.com/isala404/openchoreo.git /tmp/openchoreo
                - chmod +x /tmp/openchoreo/aws-marketplace/activate-tls.sh
                - /tmp/openchoreo/aws-marketplace/activate-tls.sh

  # ---------------------------------------------------------------------------
  # Lambda trigger + WaitCondition
  # ---------------------------------------------------------------------------
  TLSLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: trigger-tls-codebuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt TLSProject.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  TLSLambdaFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${Phase1StackName}-tls-trigger
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TLSLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          TLS_PROJECT: !Ref TLSProject
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          import urllib.request

          codebuild = boto3.client('codebuild')

          def send_cfn_response(event, status, reason=''):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason or f'{status} via Lambda',
                  'PhysicalResourceId': event.get('PhysicalResourceId', event['LogicalResourceId']),
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
              }).encode()
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT',
                                          headers={'Content-Type': ''})
              urllib.request.urlopen(req)

          def handler(event, context):
              print(json.dumps(event))
              request_type = event['RequestType']

              if request_type == 'Create':
                  wait_url = event['ResourceProperties'].get('WaitConditionUrl', '')
                  try:
                      codebuild.start_build(
                          projectName=os.environ['TLS_PROJECT'],
                          environmentVariablesOverride=[
                              {'name': 'WAIT_CONDITION_URL', 'value': wait_url, 'type': 'PLAINTEXT'},
                          ],
                      )
                  except Exception as e:
                      send_cfn_response(event, 'FAILED', f'Failed to start TLS build: {e}')
                      return
                  send_cfn_response(event, 'SUCCESS')

              elif request_type == 'Delete':
                  send_cfn_response(event, 'SUCCESS')

              elif request_type == 'Update':
                  send_cfn_response(event, 'SUCCESS')

  TLSWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  TLSWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: TLSTrigger
    Properties:
      Handle: !Ref TLSWaitHandle
      Timeout: '1800'
      Count: 1

  TLSTrigger:
    Type: Custom::TLSTrigger
    DependsOn: [TLSAccessEntry]
    Properties:
      ServiceToken: !GetAtt TLSLambdaFn.Arn
      WaitConditionUrl: !Ref TLSWaitHandle

Outputs:
  TLSMethod:
    Value: !Ref TLSMethod
  Status:
    Value: !If [NeedsACME, 'ACME certificates issued', 'Self-signed (no change)']
